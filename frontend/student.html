<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Brelanbar - Student</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Instrument+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar"><a class="brand" href="index.html"><i class="logo" aria-hidden="true"></i>Brelanbar</a><span class="role"><span id="whoami"></span> <button id="signout" class="ghost small" hidden>Sign out</button></span></header>
  <main class="container stu">
    <section class="card" id="join-card">
      <h1 style="margin-bottom:18px">Join your lecture</h1>
      <label for="code">Room code</label>
      <input id="code" class="code-input" maxlength="12" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="Q86UTY">
      <button id="join" class="primary big" style="margin-top:6px">Join</button>
      <p id="status" class="status" role="status" aria-live="polite"></p>
      <div hidden><input id="server-url"><input type="checkbox" id="legacy"></div>
    </section>

    <section id="live-card" hidden>
      <div class="live-head"><span class="lh-l"><span id="state-pill" class="pill">Connecting</span><span id="mode-text" class="muted small"></span></span>
        <span class="lh-r"><label class="chip"><input type="checkbox" id="sound" checked> Audio</label><button type="button" class="chip" id="textsize">A+</button><button id="leave" class="chip leave" hidden>Leave</button></span></div>
      <div id="sound-banner" class="banner warn" style="margin-top:12px" hidden>Your browser blocked audio. <button id="enable-sound" class="secondary small">Enable sound</button></div>
      <div id="captions" class="captions" aria-live="polite"><p id="empty-note" class="muted">Listening for the lecturer&hellip;</p></div>
    </section>

    <section id="ask-card" hidden>
      <div class="meter" aria-hidden="true"><div id="level"></div></div>
      <div class="dock-row"><button id="request-question" class="secondary">Raise hand</button><button id="enable-mic" class="secondary">Enable microphone</button></div>
      <button id="ask" class="ask-btn" disabled>Hold to ask</button>
      <p id="ask-hint" class="muted small"></p>
      <p id="mic-note" class="muted small">Hold the button to speak. Headphones help.</p>
    </section>
  </main>
  <script>document.getElementById("textsize").onclick=function(){var c=document.getElementById("captions"),v=parseFloat(c.style.getPropertyValue("--sz")||1);c.style.setProperty("--sz",v>=1.5?1:v+.25)}</script>
  <script src="js/common.js"></script>
  <script src="js/api.js"></script>
  <script src="js/pcm-player.js"></script>
  <script src="js/student.js"></script>
</body>
</html>
